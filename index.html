(k+'Suggestions').replaceChildren();box.replaceChildren();let norm=v=>v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),q=norm(input.value);if(!q)return;let hits=known(input.name).filter(v=>norm(v).includes(q)).sort((a,b)=>Number(norm(b).startsWith(q))-Number(norm(a).startsWith(q)));for(let v of hits.slice(0,6)){let b=document.createElement('button');b.type='button';b.textContent=v;b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>{input.value=v;box.replaceChildren();input.blur()};box.append(b)}let hint=document.createElement('small');hint.textContent=hits.length>6?'Continue digitando para refinar ('+hits.length+' resultados).':hits.length?'Toque para selecionar.':'Novo cadastro ao salvar o lançamento.';box.append(hint)}document.addEventListener('pointerdown',e=>{if(!e.target.closest('.suggest'))for(let k of ['project','account'])$(k+'Suggestions').replaceChildren()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&e.target.closest('.suggest')){let b=$(e.target.name+'Suggestions');if(b?.children.length){e.preventDefault();e.stopPropagation();b.replaceChildren()}}});const f=$('entry');function categories(){f.elements.cat.innerHTML=db.cats[f.elements.type.value].map(c=>`<option>${esc(c)}</option>`).join('')}function edit(id){editing=id||null;f.reset();let r=db.rows.find(x=>x.id===id);f.elements.date.value=today();f.elements.due.value=today();f.elements.type.value=r?.type||'in';categories();if(r)for(let k of ['type','desc','cat','date','due','paid','project','account','note','value'])f.elements[k].value=k==='value'?fmt(r.value):r[k]||'';f.elements.parts.disabled=!!r;for(let k of ['project','account'])$(k+'Suggestions').replaceChildren();$('formtitle').textContent=r?'Editar lançamento':'Novo lançamento';$('dlg').showModal()}function known(k){return [...new Set([...(db.registry?.[k]||[]),...db.rows.map(r=>r[k])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}function addKnown(e,k){e.preventDefault();let v=e.target.elements.item.value.trim();if(!v)return;db.registry??={};db.registry[k]=[...new Set([...(db.registry[k]||[]),v])];save();render()}function shift(d,i){let [a,b,c]=d.split('-').map(Number),x=new Date(a,b-1+i,1,12);x.setDate(Math.min(c,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x.toLocaleDateString('sv-SE')}function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}f.onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(f)),n=editing?1:+r.parts,total=cents(r.value);delete r.parts;if(!Number.isSafeInteger(total)||!Number.isInteger(n)||n<1||n>120||total<n||n>1&&r.paid){alert('Verifique o valor das parcelas. Para parcelar, deixe a liquidação em branco.');return}let previous=db.rows.slice();if(editing){db.rows=db.rows.map(x=>x.id===editing?{...r,id:editing,value:total}:x)}else for(let i=0;i<n;i++)db.rows.push({...r,id:uid(),value:Math.floor(total/n)+(i<total%n?1:0),due:shift(r.due,i),desc:r.desc+(n>1?` (${i+1}/${n})`:'')});if(!save()){db.rows=previous;return}$('dlg').close();render()};function settle(id){let r=db.rows.find(x=>x.id===id);if(!r||r.paid)return;let old=r.paid;r.paid=today();if(!save())r.paid=old;render()}function removeRow(id){if(confirm('Excluir este lançamento?')){db.rows=db.rows.filter(x=>x.id!==id);save();render()}}function setGoals(e){e.preventDefault();let a=new FormData(e.target);db.opening=cents(a.get('opening'));db.goals[y]={in:cents(a.get('in')),out:cents(a.get('out'))};save();render()}function addCat(e){e.preventDefault();let a=new FormData(e.target),t=a.get('type'),c=a.get('cat').trim();if(c&&!db.cats[t].includes(c))db.cats[t].push(c);save();render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('atelie-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function csv(){let fields=['type','desc','cat','value','date','due','paid','project','account','note'];let quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('atelie-lancamentos.csv','\ufeff'+['Tipo;Descrição;Categoria;Valor;Lançamento;Vencimento;Liquidação;Projeto;Conta;Observações',...db.rows.map(r=>fields.map(k=>quote(k==='value'?(r.value/100).toFixed(2).replace('.',','):k==='type'?(r.type==='in'?'Receita':'Despesa'):r[k])).join(';'))].join('\r\n'),'text/csv;charset=utf-8')} $('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.rows)||!['in','out'].every(t=>Array.isArray(x.cats?.[t])&&x.cats[t].every(c=>typeof c==='string'))||!Number.isSafeInteger(x.opening)||!x.goals||!x.rows.every(r=>['in','out'].includes(r.type)&&Number.isSafeInteger(r.value)&&r.value>0&&/^[a-zA-Z0-9-]+$/.test(r.id)&&['date','due'].every(k=>/^\d{4}-\d{2}-\d{2}$/.test(r[k]))&&(!r.paid||/^\d{4}-\d{2}-\d{2}$/.test(r.paid))))throw Error();if(confirm('Substituir TODOS os registros locais pelo backup?')){db=x;db.monthGoals??={};save();render()}}catch{alert('Backup inválido ou não legível.')}e.target.value=''};
function goPage(delta){page+=delta;if(tab==='Lançamentos')filterList();else render()}
const themeMedia=matchMedia('(prefers-color-scheme: dark)');function applyTheme(){let t=localStorage.getItem('atelie-theme')||'auto';document.documentElement.dataset.theme=t==='auto'?(themeMedia.matches?'dark':'light'):t}function changeTheme(t){localStorage.setItem('atelie-theme',t);applyTheme()}applyTheme();themeMedia.addEventListener?.('change',applyTheme);
function themeSettings(){let t=localStorage.getItem('atelie-theme')||'auto';return `<section><h3>Aparência</h3><label>Tema<select onchange="changeTheme(this.value)">${[['auto','Automático (sistema)'],['light','Claro'],['dark','Escuro']].map(([v,n])=>`<option value="${v}" ${v===t?'selected':''}>${n}</option>`).join('')}</select></label></section>`}
function monthlySettings(){return `<section><h3>Metas mensais · ${y}</h3><p class="muted">Receita mínima e limite de despesas por mês. Zero significa não definida. Metas anuais continuam independentes.</p><form onsubmit="saveMonthly(event)">${months.map((n,i)=>{let k=y+'-'+String(i+1).padStart(2,'0'),g=db.monthGoals?.[k]||{};return `<div class="grid"><b>${n}</b><label>Receitas<input data-money inputmode="numeric" name="${k}in" value="${fmt(g.in||0)}"></label><label>Despesas<input data-money inputmode="numeric" name="${k}out" value="${fmt(g.out||0)}"></label></div>`}).join('')}<button class="primary">Salvar metas mensais</button></form></section>`}
function saveMonthly(e){e.preventDefault();let f=new FormData(e.target);db.monthGoals??={};for(let i=1;i<=12;i++){let k=y+'-'+String(i).padStart(2,'0');db.monthGoals[k]={in:cents(f.get(k+'in')),out:cents(f.get(k+'out'))}}save();render()}
function management(){let rows=months.map((n,i)=>{let k=y+'-'+String(i+1).padStart(2,'0'),r=db.rows.filter(x=>x.paid?.startsWith(k)),g=db.monthGoals?.[k]||{},a=sum(r,'in'),b=sum(r,'out');return [n,g.in?money(g.in):'—',money(a),g.in?money(a-g.in):'—',g.out?money(g.out):'—',money(b),g.out?money(g.out-b):'—',g.in&&g.out?money(a-b-(g.in-g.out)):'—']});let pend=db.rows.filter(r=>!r.paid&&match(r.due)),late=pend.filter(r=>r.due<today()),paid=db.rows.filter(r=>match(r.paid));let daily={};for(let r of paid)daily[r.paid]=(daily[r.paid]||0)+(r.type==='in'?r.value:-r.value);let days=Object.entries(daily).sort();let end=String(y)+(m?'-'+m:'-12')+'-31',bal=db.opening+net(db.rows.filter(r=>r.paid&&r.paid<=end));return `<section><h3>Meta x realizado · ${y}</h3><p class="muted">Desvio positivo é favorável. Resultado-meta calculado quando ambas as metas existem.</p>${table(['Mês','Meta receita','Recebido','Desvio receita','Limite despesa','Pago','Folga despesa','Desvio resultado'],rows)}</section><section><h3>Necessidade de caixa e inadimplência</h3><div class="grid">${card('A receber vencido',money(sum(late,'in')))}${card('A pagar vencido',money(sum(late,'out')))}${card('Necessidade líquida no período',money(Math.max(0,sum(pend,'out')-sum(pend,'in')-bal)))}</div><p class="muted">Estimativa: obrigações menos recebimentos previstos e saldo ao fim do período. Não garante liquidez.</p></section>${m?`<section><h3>Resultado diário · ${m}/${y}</h3>${area([{name:'Resultado diário',color:'#168477',values:days.map(x=>x[1])}],days.map(x=>x[0].slice(8)))}</section>`:''}`}
function printReport(){let paid=db.rows.filter(r=>match(r.paid)),pending=db.rows.filter(r=>!r.paid&&match(r.due)),a=sum(paid,'in'),b=sum(paid,'out'),period=m?months[+m-1]+'/'+y:String(y);let vals=months.map((n,i)=>{let r=paid.filter(x=>x.paid.startsWith(y+'-'+String(i+1).padStart(2,'0')));return [n,sum(r,'in'),sum(r,'out')]});let groups=t=>Object.entries(paid.filter(r=>r.type===t).reduce((o,r)=>(o[r.cat]=(o[r.cat]||0)+r.value,o),Object.create(null))).sort((a,b)=>b[1]-a[1]);$('report').innerHTML=`<div style="display:flex;align-items:center;gap:16px;margin-bottom:24px"><img src="logo.webp" width="70"><div><h2>Ateliê · Relatório gerencial</h2><p>Período: ${period} · Emitido em ${today().split('-').reverse().join('/')}</p></div></div><section><h3>1. Fluxo de caixa</h3>${table(['Receitas recebidas','Despesas pagas','Resultado','Margem de caixa'],[[money(a),money(b),money(a-b),a?((a-b)/a*100).toFixed(1)+'%':'—']])}${area([{name:'Receitas',color:'#168477',values:vals.map(x=>x[1])},{name:'Despesas',color:'#b67b50',values:vals.map(x=>x[2])}],months)}${table(['Mês','Receitas','Despesas','Resultado'],vals.filter((x,i)=>!m||i===+m-1).map(x=>[x[0],money(x[1]),money(x[2]),money(x[1]-x[2])]))}</section><section class="report-long"><h3>2. Composição financeira por categoria</h3>${table(['Receitas','Valor'],groups('in').map(x=>[esc(x[0]),money(x[1])]))}${table(['Despesas','Valor'],groups('out').map(x=>[esc(x[0]),money(x[1])]))}</section><section class="report-break"><h3>3. Pendências por vencimento</h3>${table(['A receber','A pagar','Recebimentos vencidos','Pagamentos vencidos'],[[money(sum(pending,'in')),money(sum(pending,'out')),money(sum(pending.filter(r=>r.due<today()),'in')),money(sum(pending.filter(r=>r.due<today()),'out'))]])}</section>${management()}<p>Relatório gerencial em regime de caixa. Não substitui DRE contábil. Metas e necessidade de caixa são estimativas.</p>`;document.body.classList.add('printing');window.print()}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
