</style><header><img src="logo.webp" alt="Logomarca"><div><h1>Ateliê · Financeiro</h1><small>Gestão de arquitetura e projetos</small></div></header><nav id="nav"></nav><main><div class="toolbar"><select id="year" aria-label="Ano"></select><select id="month" aria-label="Mês"></select><button class="primary right" onclick="edit()">+ Lançamento</button></div><div id="view"></div></main><dialog id="dlg"><form id="entry"><h2 id="formtitle">Novo lançamento</h2><div class="grid"><label>Tipo<select name="type" onchange="categories()"><option value="in">Receita</option><option value="out">Despesa</option></select></label><label>Descrição<input name="desc" required maxlength="180"></label><label>Valor (R$)<input name="value" type="number" min="0.01" step="0.01" required></label><label>Categoria<select name="cat" required></select></label><label>Data do lançamento<input name="date" type="date" required></label><label>Vencimento<input name="due" type="date" required></label><label>Data de recebimento / pagamento<input name="paid" type="date"></label><label>Projeto / cliente<input name="project" list="projects" maxlength="100"><datalist id="projects"></datalist><select aria-label="Selecionar projeto cadastrado" id="projectPick" onchange="if(this.value)document.getElementById('entry').elements.project.value=this.value"><option value="">Selecionar cadastrado…</option></select></label><label>Conta / meio de pagamento<input name="account" maxlength="100" placeholder="Banco, Pix, cartão..."><select aria-label="Selecionar conta cadastrada" id="accountPick" onchange="if(this.value)document.getElementById('entry').elements.account.value=this.value"><option value="">Selecionar cadastrada…</option></select></label><label>Observações<input name="note" maxlength="500"></label><label>Parcelas (novos lançamentos)<input name="parts" type="number" min="1" max="120" value="1"></label></div><p class="muted">Sem data de pagamento, o lançamento fica pendente. O valor informado é o total a dividir e ut),'red')}${card('Resultado de caixa',money(inc-out))}${card('Saldo acumulado',money(balance))}${card('A receber · todos os anos',money(sum(pending,'in')))}${card('A pagar · todos os anos',money(sum(pending,'out')))}${card('Margem de caixa',inc?((inc-out)/inc*100).toFixed(1)+'%':'—')}${card('Vencidos · todos os anos',money(pending.filter(r=>r.due<today()).reduce((a,r)=>a+r.value,0)))}</div><section><h3>Movimentação mensal · ${y}</h3><p class="muted">Verde: receitas · Coral: despesas</p><div class="chart">${vals.map((a,i)=>`<div class="month" title="${months[i]}: ${money(a[0])} / ${money(a[1])}"><div class="bar" style="height:${a[0]/max*100}%"></div><div class="bar out" style="height:${a[1]/max*100}%"></div><span>${months[i]}</span></div>`).join('')}</div>${table(['Mês','Receitas','Despesas','Resultado'],vals.map((a,i)=>[months[i],money(a[0]),money(a[1]),money(a[0]-a[1])]))}</section><section><h3>Metas anuais</h3>${['in','out'].map(t=>`<div class="line"><span>${t==='in'?'Meta de receitas':'Limite de despesas'}</span><b>${money(vals.reduce((a,x)=>a+x[t==='in'?0:1],0))} / ${goal[t]?money(goal[t]):'Não definida'}</b></div>`).join('')}</section><section><h3>Despesas por categoria</h3>${db.cats.out.map(c=>[c,sum(paid.filter(r=>r.cat===c),'out')]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]).map(a=>`<div class="line">${esc(a[0])}<b>${money(a[1])}</b></div>`).join('')||'<p class="muted">Sem despesas pagas.</p>'}</section>`}else if(tab==='Lançamentos'){v=`<section><h2>Lançamentos por data de registro</h2><div class="toolbar"><input id="search" placeholder="Buscar descrição, projeto..." oninput="filterList()"><select id="kind" onchange="filterList()"><option value="">Todos os tipos</option><option value="in">Receitas</option><option value="out">Despesas</option></select><button onclick="csv()">Exportar CSV</button></div><div id="list">${listing(period)}</div></section>`}else if(tab==='Pendências'){v=`<section><h2>Contas a receber e a pagar</h2><p class="muted">Por vencimento no período selecionado.</p><div class="grid">${card('A receber',money(sum(pending.filter(r=>match(r.due)),'in')),'green')}${card('A pagar',money(sum(pending.filter(r=>match(r.due)),'out')),'red')}</div>${listing(pending.filter(r=>match(r.due)))}</section>`}else if(tab==='Projetos'){let names=[...new Set(db.rows.filter(r=>match(r.paid)||(!r.paid&&match(r.due))).map(r=>r.project).filter(Boolean))];v=`<section><h2>Resultado por projeto / cliente</h2><p class="muted">Valores liquidados no período selecionado e pendências com vencimento no período selecionado.</p>${table(['Projeto','Recebido','Pago','Resultado','A receber','A pagar'],names.map(n=>{let a=paid.filter(r=>r.project===n),b=pending.filter(r=>r.project===n&&match(r.due));return [esc(n),money(sum(a,'in')),money(sum(a,'out')),money(net(a)),money(sum(b,'in')),money(sum(b,'out'))]}))}</section>`}else if(tab==='Gráficos'){v=analytics(paid,pending.filter(r=>match(r.due)));}else if(tab==='Comparativo'){let ys=[...new Set([y,...db.rows.map(r=>r.paid?+r.paid.slice(0,4):+r.date.slice(0,4))])].sort((a,b)=>a-b);v=`<section><h2>Evolução anual</h2><p class="muted">Regime de caixa · anos completos registrados, ano atual pode estar incompleto.</p>${table(['Ano','Receitas','Despesas','Resultado','Margem','Variação receita','Variação despesa'],ys.map(a=>{let r=db.rows.filter(x=>x.paid?.startsWith(String(a))),p=db.rows.filter(x=>x.paid?.startsWith(String(a-1))),i=sum(r,'in'),o=sum(r,'out'),pct=(n,b)=>b?((n/b-1)*100).toFixed(1)+'%':'—';return [a,money(i),money(o),money(i-o),i?((i-o)/i*100).toFixed(1)+'%':'—',pct(i,sum(p,'in')),pct(o,sum(p,'out'))]}))}</section>`}else{v=`<section><h2>Configurações</h2><form onsubmit="setGoals(event)"><div class="grid"><label>Saldo inicial (R$)<input name="opening" type="number" step=".01" value="${db.opening/100}"></label><label>Meta anual de receitas · ${y}<input name="in" type="number" min="0" step=".01" value="${(db.goals[y]?.in||0)/100}"></label><label>Limite anual de despesas · ${y}<input name="out" type="number" min="0" step=".01" value="${(db.goals[y]?.out||0)/100}"></label></div><button class="primary">Salvar configurações</button></form></section><section><h3>Plano de contas</h3><form class="toolbar" onsubmit="addCat(event)"><select name="type"><option value="in">Receita</option><option value="out">Despesa</option></select><input name="cat" required placeholder="Nova categoria"><button>Adicionar</button></form>${['in','out'].map(t=>`<h3>${t==='in'?'Receitas':'Despesas'}</h3><p>${db.cats[t].map(esc).join(' · ')}</p>`).join('')}</section>${['project','account'].map(k=>`<section><h3>${k==='project'?'Projetos / clientes cadastrados':'Contas / meios de pagamento'}</h3><form class="toolbar" onsubmit="addKnown(event,'${k}')"><input name="item" required maxlength="100" placeholder="Novo cadastro"><button>Adicionar</button></form><p>${known(k).map(esc).join(' · ')||'Nenhum cadastro'}</p></section>`).join('')}<section><h3>Segurança dos dados</h3><p>Os registros ficam neste navegador. Faça backups frequentes. Para usar outro dispositivo, restaure o backup mais recente.</p><div class="toolbar"><button onclick="backup()">Baixar backup completo</button><button onclick="$('restore').click()">Restaurar backup</button><button onclick="csv()">Exportar todos em CSV</button></div></section>`}$('view').innerHTML=v}function ring(label,p){let v=p===null?'—':p.toFixed(1).replace('.',',')+'%';return `<div><div class="ring" style="--pct:${Math.max(0,Math.min(100,p||0))}%" data-label="${v}"></div><small>${label}</small></div>`}function trend(vals){let max=Math.max(1,...vals.flat()),x=i=>24+i*30,y=v=>132-v/max*110;return `<svg class="trend" viewBox="0 0 380 158" role="img" aria-label="Tendência mensal de receitas e despesas">${[22,59,96,132].map(n=>`<line class="guide" x1="24" x2="354" y1="${n}" y2="${n}"/>`).join('')}${[0,1].map(k=>`<polyline stroke="${k?'#ffad86':'#40dfb0'}" points="${vals.map((r,i)=>x(i)+','+y(r[k])).join(' ')}"/>`).join('')}${months.map((n,i)=>`<text x="${x(i)}" y="150" text-anchor="middle">${n}</text>`).join('')}</svg>`}function analytics(paid,pending){let a=sum(paid,'in'),b=sum(paid,'out');let vals=months.map((_,i)=>{let r=db.rows.filter(x=>x.paid?.startsWith(y+'-'+String(i+1).padStart(2,'0')));return [sum(r,'in'),sum(r,'out')]});let max=Math.max(1,...vals.flat());let bars=(items,total,cls='')=>items.length?items.map(([n,v])=>`<div class="line"><span>${esc(n)}</span><b>${money(v)}</b></div><div class="meter ${cls}"><i style="width:${Math.min(100,v/Math.max(1,total)*100)}%"></i></div>`).join(''):'<p class="muted">Sem movimentação no período.</p>';let group=(t,k)=>[...new Set(paid.filter(r=>r.type===t).map(r=>r[k]||'Não informado'))].map(n=>[n,sum(paid.filter(r=>(r[k]||'Não informado')===n),t)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);let ys=[...new Set([y,...db.rows.filter(r=>r.paid).map(r=>+r.paid.slice(0,4))])].sort((a,b)=>a-b);let annual=ys.map(n=>{let r=db.rows.filter(x=>x.paid?.startsWith(String(n)));return [n,sum(r,'in'),sum(r,'out')]});let am=Math.max(1,...annual.flatMap(r=>r.slice(1)));return `<h2>Gráficos e análises</h2><p class="muted">Indicadores por liquidação; pendências por vencimento. Toque em um mês do gráfico para filtrar.</p><div class="grid">${card('Receitas',money(a),'green')}${card('Despesas',money(b),'red')}${card('Resultado',money(a-b))}${card('Margem',a?((a-b)/a*100).toFixed(1)+'%':'—')}</div><section><h3>Movimentação mensal · ${y}</h3><p class="muted">Verde: receitas · Coral: despesas</p><div class="chart">${vals.map((r,i)=>`<button class="month ${m===String(i+1).padStart(2,'0')?'selected':''}" style="border:0;padding:0 0 25px" onclick="m='${String(i+1).padStart(2,'0')}';$('month').value=m;render()" aria-label="${months[i]}: ${money(r[0])} / ${money(r[1])}"><div class="bar" style="height:${r[0]/max*100}%"></div><div class="bar out" style="height:${r[1]/max*100}%"></div><span>${months[i]}</span></button>`).join('')}</div></section><div class="analytics"><section><h3>Tendência mensal · ${y}</h3><div class="legend"><b>● Receitas</b><b>● Despesas</b></div>${trend(vals)}</section><section><h3>Indicadores de desempenho</h3><div class="ringpair">${ring('Margem de caixa',a?(a-b)/a*100:null)}${ring('Receita comprometida',a?b/a*100:null)}</div></section><section><h3>Receitas por categoria</h3>${bars(group('in','cat'),a)}</section><section><h3>Despesas por categoria</h3>${bars(group('out','cat'),b,'out')}</section><section><h3>Receitas por projeto</h3>${bars(group('in','project'),a)}</section><section><h3>Despesas por projeto</h3>${bars(group('out','project'),b,'out')}</section><section><h3>Contas em aberto</h3>${bars([['A receber',sum(pending,'in')],['A pagar',sum(pending,'out')]],Math.max(sum(pending,'in'),sum(pending,'out')))}</section><section><h3>Evolução anual · todos os anos</h3>${annual.map(r=>`<h3>${r[0]}</h3>${bars([['Receitas',r[1]]],am)}${bars([['Despesas',r[2]]],am,'out')}`).join('')}</section></div>`}function filterList(){let q=$('search').value.toLowerCase(),t=$('kind').value;$('list').innerHTML=listing(db.rows.filter(r=>match(r.date)&&(!t||r.type===t)&&[r.desc,r.project,r.cat,r.note].join(' ').toLowerCase().includes(q)))}const f=$('entry');function categories(){f.elements.cat.innerHTML=db.cats[f.elements.type.value].map(c=>`<option>${esc(c)}</option>`).join('')}function edit(id){editing=id||null;f.reset();let r=db.rows.find(x=>x.id===id);f.elements.date.value=today();f.elements.due.value=today();f.elements.type.value=r?.type||'in';categories();if(r)for(let k of ['type','desc','cat','date','due','paid','project','account','note','value'])f.elements[k].value=k==='value'?r.value/100:r[k]||'';f.elements.parts.disabled=!!r;$('projects').innerHTML=[...new Set(db.rows.map(x=>x.project).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('');for(let k of ['project','account']){$(k+'Pick').innerHTML='<option value="">Selecionar cadastrado…</option>'+known(k).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');} $('formtitle').textContent=r?'Editar lançamento':'Novo lançamento';$('dlg').showModal()}function known(k){return [...new Set([...(db.registry?.[k]||[]),...db.rows.map(r=>r[k])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}function addKnown(e,k){e.preventDefault();let v=e.target.elements.item.value.trim();if(!v)return;db.registry??={};db.registry[k]=[...new Set([...(db.registry[k]||[]),v])];save();render()}function shift(d,i){let [a,b,c]=d.split('-').map(Number),x=new Date(a,b-1+i,1,12);x.setDate(Math.min(c,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x.toLocaleDateString('sv-SE')}function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}f.onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(f)),n=editing?1:+r.parts,total=Math.round(+r.value*100);delete r.parts;if(total<n||n>1&&r.paid){alert('Verifique o valor das parcelas. Para parcelar, deixe a liquidação em branco.');return}if(editing){db.rows=db.rows.map(x=>x.id===editing?{...r,id:editing,value:total}:x)}else for(let i=0;i<n;i++)db.rows.push({...r,id:uid(),value:Math.floor(total/n)+(i<total%n?1:0),due:shift(r.due,i),desc:r.desc+(n>1?` (${i+1}/${n})`:'')});save();$('dlg').close();render()};function settle(id){let r=db.rows.find(x=>x.id===id);edit(id);f.elements.paid.value=today()}function removeRow(id){if(confirm('Excluir este lançamento?')){db.rows=db.rows.filter(x=>x.id!==id);save();render()}}function setGoals(e){e.preventDefault();let a=new FormData(e.target);db.opening=Math.round(+a.get('opening')*100);db.goals[y]={in:Math.round(+a.get('in')*100),out:Math.round(+a.get('out')*100)};save();render()}function addCat(e){e.preventDefault();let a=new FormData(e.target),t=a.get('type'),c=a.get('cat').trim();if(c&&!db.cats[t].includes(c))db.cats[t].push(c);save();render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('atelie-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function csv(){let fields=['type','desc','cat','value','date','due','paid','project','account','note'];let quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('atelie-lancamentos.csv','\ufeff'+['Tipo;Descrição;Categoria;Valor;Lançamento;Vencimento;Liquidação;Projeto;Conta;Observações',...db.rows.map(r=>fields.map(k=>quote(k==='value'?(r.value/100).toFixed(2).replace('.',','):k==='type'?(r.type==='in'?'Receita':'Despesa'):r[k])).join(';'))].join('\r\n'),'text/csv;charset=utf-8')} $('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.rows)||!['in','out'].every(t=>Array.isArray(x.cats?.[t])&&x.cats[t].every(c=>typeof c==='string'))||!Number.isSafeInteger(x.opening)||!x.goals||!x.rows.every(r=>['in','out'].includes(r.type)&&Number.isSafeInteger(r.value)&&r.value>0&&/^[a-zA-Z0-9-]+$/.test(r.id)&&['date','due'].every(k=>/^\d{4}-\d{2}-\d{2}$/.test(r[k]))&&(!r.paid||/^\d{4}-\d{2}-\d{2}$/.test(r.paid))))throw Error();if(confirm('Substituir TODOS os registros locais pelo backup?')){db=x;save();render()}}catch{alert('Backup inválido ou não legível.')}e.target.value=''};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
