<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#34434a"><title>Ateliê | Financeiro</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#34434a;font:15px system-ui,sans-serif}header{background:#fff;padding:18px 5%;display:flex;align-items:center;gap:16px;border-bottom:1px solid #ddd}header img{width:76px;border-radius:12px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:24px}small,.muted{color:#68777b}nav{display:flex;gap:8px;overflow:auto;padding:12px 5%;background:#34434a}button,select,input{font:inherit;border:1px solid #d5d6d2;border-radius:9px;padding:11px;background:white;color:inherit;min-width:0}button{cursor:pointer;font-weight:600}nav button{white-space:nowrap;background:transparent;color:white;border:0}nav button.active{background:#a47755}main{max-width:1250px;margin:auto;padding:24px 4% 60px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}.primary{background:#34434a;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}.card,section{background:white;border:1px solid #e5e1db;border-radius:16px;padding:20px;margin-bottom:16px}.card{margin:0}.amount{font-size:clamp(20px,3vw,29px);font-weight:700;margin-top:10px}.green{color:#32745e}.red{color:#a34c44}.chart{display:flex;align-items:end;height:190px;gap:5px;border-bottom:1px solid #ddd}.month{flex:1;min-width:0;display:flex;align-items:end;justify-content:center;gap:3px;height:100%;position:relative;padding-bottom:25px}.month span{position:absolute;bottom:0;font-size:10px}.bar{width:38%;border-radius:4px 4px 0 0;background:#518779}.bar.out{background:#a47755}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #eee}th{font-size:12px;text-transform:uppercase;color:#68777b}label{display:grid;gap:6px;font-size:13px;font-weight:600}form .grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}dialog{border:0;border-radius:18px;width:min(720px,94vw);max-height:90vh;overflow:auto;padding:24px;color:inherit}dialog::backdrop{background:#18262b88}.right{margin-left:auto}.danger{color:#a34c44}.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.empty{padding:24px;text-align:center;color:#68777b} @media(max-width:600px){main{padding:18px 12px}section,.card{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toolbar>*{max-width:100%}header{padding:12px}h1{font-size:20px}button,input,select{font-size:16px}.amount{font-size:19px}}
</style><header><img src="logo.webp" alt="Logomarca"><div><h1>Ateliê · Financeiro</h1><small>Gestão de arquitetura e projetos</small></div></header><nav id="nav"></nav><main><div class="toolbar"><select id="year" aria-label="Ano"></select><select id="month" aria-label="Mês"></select><button class="primary right" onclick="edit()">+ Lançamento</button></div><div id="view"></div></main><dialog id="dlg"><form id="entry"><h2 id="formtitle">Novo lançamento</h2><div class="grid"><label>Tipo<select name="type" onchange="categories()"><option value="in">Receita</option><option value="out">Despesa</option></select></label><label>Descrição<input name="desc" required maxlength="180"></label><label>Valor (R$)<input name="value" type="number" min="0.01" step="0.01" required></label><label>Categoria<select name="cat" required></select></label><label>Data do lançamento<input name="date" type="date" required></label><label>Vencimento<input name="due" type="date" required></label><label>Data de recebimento / pagamento<input name="paid" type="date"></label><label>Projeto / cliente<input name="project" list="projects" maxlength="100"><datalist id="projects"></datalist></label><label>Conta / meio de pagamento<input name="account" maxlength="100" placeholder="Banco, Pix, cartão..."></label><label>Observações<input name="note" maxlength="500"></label><label>Parcelas (novos lançamentos)<input name="parts" type="number" min="1" max="120" value="1"></label></div><p class="muted">Sem data de pagamento, o lançamento fica pendente. O valor informado é o total a dividir entre as parcelas.</p><div class="toolbar"><button type="button" onclick="dlg.close()">Cancelar</button><button class="primary">Salvar</button></div></form></dialog><input type="file" id="restore" accept=".json" hidden><script>
const defaults={in:['Projetos arquitetônicos','Interiores','Consultoria','Acompanhamento de obra','Receitas não operacionais','Outras entradas / aportes'],out:['Materiais de consumo','Serviços terceirizados','Transporte e viagens','Despesas bancárias','Pessoal e pró-labore','Aluguel e condomínio','Energia, água e internet','Software e licenças','Marketing','Impostos','CAU / RRT','Investimentos','Outras despesas']};const key='atelie-finance-v1';let db={rows:[],cats:defaults,goals:{},opening:0};try{let x=localStorage.getItem(key);if(x)db=JSON.parse(x)}catch(e){alert('Não foi possível ler os dados locais. Verifique seu backup.')}const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('sv-SE'), money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n/100), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), sum=(r,t)=>r.filter(x=>x.type===t).reduce((a,x)=>a+x.value,0), net=r=>sum(r,'in')-sum(r,'out');let tab='Painel',editing=null;const tabs=['Painel','Lançamentos','Pendências','Projetos','Comparativo','Configurações'];const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];let y=new Date().getFullYear(),m='';function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('Falha ao salvar. Exporte um backup imediatamente.');return false}}function years(){let a=new Set([y,new Date().getFullYear(),...db.rows.flatMap(r=>[r.date,r.due,r.paid].filter(Boolean).map(d=>+d.slice(0,4)))]);$('year').innerHTML=[...a].sort((a,b)=>b-a).map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}$('month').innerHTML='<option value="">Ano inteiro</option>'+months.map((v,i)=>`<option value="${String(i+1).padStart(2,'0')}">${v}</option>`).join('');$('year').onchange=e=>{y=+e.target.value;render()};$('month').onchange=e=>{m=e.target.value;render()};function match(d){return d&&d.startsWith(String(y)+(m?'-'+m:''))}function card(t,v,c=''){return `<div class="card"><small>${t}</small><div class="amount ${c}">${v}</div></div>`}function table(headers,rows){return rows.length?`<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`:'<div class="empty">Nenhum registro neste período.</div>'}function status(r){return r.paid?'Liquidado':r.due<today()?'Vencido':'Pendente'}function listing(r){return table(['Descrição','Categoria','Vencimento','Liquidação','Valor','Situação','Ações'],r.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>[esc(x.desc),esc(x.cat),esc(x.due),esc(x.paid||'—'),`<span class="${x.type==='in'?'green':'red'}">${money(x.value)}</span>`,status(x),`<button onclick="edit('${x.id}')">Editar</button> ${!x.paid?`<button onclick="settle('${x.id}')">Liquidar</button>`:''} <button class="danger" onclick="removeRow('${x.id}')">Excluir</button>`]))}function render(){years();$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let paid=db.rows.filter(r=>match(r.paid)),pending=db.rows.filter(r=>!r.paid),period=db.rows.filter(r=>match(r.date)),inc=sum(paid,'in'),out=sum(paid,'out'),v='';if(tab==='Painel'){let end=String(y)+(m?'-'+m:'-12')+'-31',balance=db.opening+net(db.rows.filter(r=>r.paid&&r.paid<=end));let vals=months.map((_,i)=>{let r=db.rows.filter(x=>x.paid?.startsWith(y+'-'+String(i+1).padStart(2,'0')));return [sum(r,'in'),sum(r,'out')]});let max=Math.max(1,...vals.flat());let goal=db.goals[y]||{};v=`<h2>Visão financeira</h2><div class="grid">${card('Receitas recebidas',money(inc),'green')}${card('Despesas pagas',money(out),'red')}${card('Resultado de caixa',money(inc-out))}${card('Saldo acumulado',money(balance))}${card('A receber · todos os anos',money(sum(pending,'in')))}${card('A pagar · todos os anos',money(sum(pending,'out')))}${card('Margem de caixa',inc?((inc-out)/inc*100).toFixed(1)+'%':'—')}${card('Vencidos · todos os anos',money(pending.filter(r=>r.due<today()).reduce((a,r)=>a+r.value,0)))}</div><section><h3>Movimentação mensal · ${y}</h3><p class="muted">Verde: receitas · Marrom: despesas</p><div class="chart">${vals.map((a,i)=>`<div class="month" title="${months[i]}: ${money(a[0])} / ${money(a[1])}"><div class="bar" style="height:${a[0]/max*100}%"></div><div class="bar out" style="height:${a[1]/max*100}%"></div><span>${months[i]}</span></div>`).join('')}</div>${table(['Mês','Receitas','Despesas','Resultado'],vals.map((a,i)=>[months[i],money(a[0]),money(a[1]),money(a[0]-a[1])]))}</section><section><h3>Metas anuais</h3>${['in','out'].map(t=>`<div class="line"><span>${t==='in'?'Meta de receitas':'Limite de despesas'}</span><b>${money(vals.reduce((a,x)=>a+x[t==='in'?0:1],0))} / ${goal[t]?money(goal[t]):'Não definida'}</b></div>`).join('')}</section><section><h3>Despesas por categoria</h3>${db.cats.out.map(c=>[c,sum(paid.filter(r=>r.cat===c),'out')]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]).map(a=>`<div class="line">${esc(a[0])}<b>${money(a[1])}</b></div>`).join('')||'<p class="muted">Sem despesas pagas.</p>'}</section>`}else if(tab==='Lançamentos'){v=`<section><h2>Lançamentos por data de registro</h2><div class="toolbar"><input id="search" placeholder="Buscar descrição, projeto..." oninput="filterList()"><select id="kind" onchange="filterList()"><option value="">Todos os tipos</option><option value="in">Receitas</option><option value="out">Despesas</option></select><button onclick="csv()">Exportar CSV</button></div><div id="list">${listing(period)}</div></section>`}else if(tab==='Pendências'){v=`<section><h2>Contas a receber e a pagar</h2><p class="muted">Todos os anos, inclusive vencidos e futuros.</p>${listing(pending)}</section>`}else if(tab==='Projetos'){let names=[...new Set(db.rows.map(r=>r.project).filter(Boolean))];v=`<section><h2>Resultado por projeto / cliente</h2><p class="muted">Valores liquidados no período selecionado e pendências de todos os anos.</p>${table(['Projeto','Recebido','Pago','Resultado','A receber','A pagar'],names.map(n=>{let a=paid.filter(r=>r.project===n),b=pending.filter(r=>r.project===n);return [esc(n),money(sum(a,'in')),money(sum(a,'out')),money(net(a)),money(sum(b,'in')),money(sum(b,'out'))]}))}</section>`}else if(tab==='Comparativo'){let ys=[...new Set([y,...db.rows.map(r=>r.paid?+r.paid.slice(0,4):+r.date.slice(0,4))])].sort((a,b)=>a-b);v=`<section><h2>Evolução anual</h2><p class="muted">Regime de caixa · anos completos registrados, ano atual pode estar incompleto.</p>${table(['Ano','Receitas','Despesas','Resultado','Margem','Variação receita','Variação despesa'],ys.map(a=>{let r=db.rows.filter(x=>x.paid?.startsWith(String(a))),p=db.rows.filter(x=>x.paid?.startsWith(String(a-1))),i=sum(r,'in'),o=sum(r,'out'),pct=(n,b)=>b?((n/b-1)*100).toFixed(1)+'%':'—';return [a,money(i),money(o),money(i-o),i?((i-o)/i*100).toFixed(1)+'%':'—',pct(i,sum(p,'in')),pct(o,sum(p,'out'))]}))}</section>`}else{v=`<section><h2>Configurações</h2><form onsubmit="setGoals(event)"><div class="grid"><label>Saldo inicial (R$)<input name="opening" type="number" step=".01" value="${db.opening/100}"></label><label>Meta anual de receitas · ${y}<input name="in" type="number" min="0" step=".01" value="${(db.goals[y]?.in||0)/100}"></label><label>Limite anual de despesas · ${y}<input name="out" type="number" min="0" step=".01" value="${(db.goals[y]?.out||0)/100}"></label></div><button class="primary">Salvar configurações</button></form></section><section><h3>Plano de contas</h3><form class="toolbar" onsubmit="addCat(event)"><select name="type"><option value="in">Receita</option><option value="out">Despesa</option></select><input name="cat" required placeholder="Nova categoria"><button>Adicionar</button></form>${['in','out'].map(t=>`<h3>${t==='in'?'Receitas':'Despesas'}</h3><p>${db.cats[t].map(esc).join(' · ')}</p>`).join('')}</section><section><h3>Segurança dos dados</h3><p>Os registros ficam neste navegador. Faça backups frequentes. Para usar outro dispositivo, restaure o backup mais recente.</p><div class="toolbar"><button onclick="backup()">Baixar backup completo</button><button onclick="$('restore').click()">Restaurar backup</button><button onclick="csv()">Exportar todos em CSV</button></div></section>`}$('view').innerHTML=v}function filterList(){let q=$('search').value.toLowerCase(),t=$('kind').value;$('list').innerHTML=listing(db.rows.filter(r=>match(r.date)&&(!t||r.type===t)&&[r.desc,r.project,r.cat,r.note].join(' ').toLowerCase().includes(q)))}const f=$('entry');function categories(){f.elements.cat.innerHTML=db.cats[f.elements.type.value].map(c=>`<option>${esc(c)}</option>`).join('')}function edit(id){editing=id||null;f.reset();let r=db.rows.find(x=>x.id===id);f.elements.date.value=today();f.elements.due.value=today();f.elements.type.value=r?.type||'in';categories();if(r)for(let k of ['type','desc','cat','date','due','paid','project','account','note','value'])f.elements[k].value=k==='value'?r.value/100:r[k]||'';f.elements.parts.disabled=!!r;$('projects').innerHTML=[...new Set(db.rows.map(x=>x.project).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('');$('formtitle').textContent=r?'Editar lançamento':'Novo lançamento';$('dlg').showModal()}function shift(d,i){let [a,b,c]=d.split('-').map(Number),x=new Date(a,b-1+i,1,12);x.setDate(Math.min(c,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x.toLocaleDateString('sv-SE')}function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}f.onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(f)),n=editing?1:+r.parts,total=Math.round(+r.value*100);delete r.parts;if(total<n||n>1&&r.paid){alert('Verifique o valor das parcelas. Para parcelar, deixe a liquidação em branco.');return}if(editing){db.rows=db.rows.map(x=>x.id===editing?{...r,id:editing,value:total}:x)}else for(let i=0;i<n;i++)db.rows.push({...r,id:uid(),value:Math.floor(total/n)+(i<total%n?1:0),due:shift(r.due,i),desc:r.desc+(n>1?` (${i+1}/${n})`:'')});save();$('dlg').close();render()};function settle(id){let r=db.rows.find(x=>x.id===id);edit(id);f.elements.paid.value=today()}function removeRow(id){if(confirm('Excluir este lançamento?')){db.rows=db.rows.filter(x=>x.id!==id);save();render()}}function setGoals(e){e.preventDefault();let a=new FormData(e.target);db.opening=Math.round(+a.get('opening')*100);db.goals[y]={in:Math.round(+a.get('in')*100),out:Math.round(+a.get('out')*100)};save();render()}function addCat(e){e.preventDefault();let a=new FormData(e.target),t=a.get('type'),c=a.get('cat').trim();if(c&&!db.cats[t].includes(c))db.cats[t].push(c);save();render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('atelie-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function csv(){let fields=['type','desc','cat','value','date','due','paid','project','account','note'];let quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('atelie-lancamentos.csv','\ufeff'+['Tipo;Descrição;Categoria;Valor;Lançamento;Vencimento;Liquidação;Projeto;Conta;Observações',...db.rows.map(r=>fields.map(k=>quote(k==='value'?(r.value/100).toFixed(2).replace('.',','):k==='type'?(r.type==='in'?'Receita':'Despesa'):r[k])).join(';'))].join('\r\n'),'text/csv;charset=utf-8')} $('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.rows)||!['in','out'].every(t=>Array.isArray(x.cats?.[t])&&x.cats[t].every(c=>typeof c==='string'))||!Number.isSafeInteger(x.opening)||!x.goals||!x.rows.every(r=>['in','out'].includes(r.type)&&Number.isSafeInteger(r.value)&&r.value>0&&/^[a-zA-Z0-9-]+$/.test(r.id)&&['date','due'].every(k=>/^\d{4}-\d{2}-\d{2}$/.test(r[k]))&&(!r.paid||/^\d{4}-\d{2}-\d{2}$/.test(r.paid))))throw Error();if(confirm('Substituir TODOS os registros locais pelo backup?')){db=x;save();render()}}catch{alert('Backup inválido ou não legível.')}e.target.value=''};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
