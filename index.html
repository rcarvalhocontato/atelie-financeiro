'))}function card(t,v,c=''){return `<div class="card"><small>${t}</small><div class="amount ${c}">${v}</div></div>`}function table(headers,rows){return rows.length?`<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`:'<div class="empty">Nenhum registro neste período.</div>'}function status(r){return r.paid?'Liquidado':r.due<today()?'Vencido':'Pendente'}function listing(r){return table(['Descrição','Categoria','Vencimento','Liquidação','Valor','Situação','Ações'],r.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>[esc(x.desc),esc(x.cat),esc(x.due),esc(x.paid||'—'),`<span class="${x.type==='in'?'green':'red'}">${money(x.value)}</span>`,`<span class="status ${status(x).toLowerCase()}">${status(x)}</span>`,`<button onclick="edit('${x.id}')">Editar</button> ${!x.paid?`<button onclick="settle('${x.id}')">Liquidar</button>`:''} <button class="danger" onclick="removeRow('${x.id}')">Excluir</button>`]))}function render(){years();$('month').hidden=['Comparativo','Configurações'].includes(tab);$('year').hidden=tab==='Comparativo';$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let paid=db.rows.filter(r=>match(r.paid)),pending=db.rows.filter(r=>!r.paid),period=db.rows.filter(r=>match(r.date)),inc=sum(paid,'in'),out=sum(paid,'out'),v='';if(tab==='Painel'){let end=String(y)+(m?'-'+m:'-12')+'-31',balance=db.opening+net(db.rows.filter(r=>r.paid&&r.paid<=end));let vals=months.map((_,i)=>{let r=db.rows.filter(x=>x.paid?.startsWith(y+'-'+String(i+1).padStart(2,'0')));return [sum(r,'in'),sum(r,'out')]});let max=Math.max(1,...vals.flat());let goal=db.goals[y]||{};v=`<h2>Visão financeira</h2><div class="grid">${card('Receitas recebidas',money(inc),'green')}${card('Despesas pagas',money(out),'red')}${card('Resultado de caixa',money(inc-out))}${card('Saldo acumulado',money(balance))}${card('A receber · todos os anos',money(sum(pending,'in')))}${card('A pagar · todos os anos',money(sum(pending,'out')))}${card('Margem de caixa',inc?((inc-out)/inc*100).toFixed(1)+'%':'—')}${card('Vencidos · todos os anos',money(pending.filter(r=>r.due<today()).reduce((a,r)=>a+r.value,0)))}</div><section><h3>Movimentação mensal · ${y}</h3><p class="muted">Verde: receitas · Marrom: despesas</p><div class="chart">${vals.map((a,i)=>`<div class="month" title="${months[i]}: ${money(a[0])} / ${money(a[1])}"><div class="bar" style="height:${a[0]/max*100}%"></div><div class="bar out" style="height:${a[1]/max*100}%"></div><span>${months[i]}</span></div>`).join('')}</div>${table(['Mês','Receitas','Despesas','Resultado'],vals.map((a,i)=>[months[i],money(a[0]),money(a[1]),money(a[0]-a[1])]))}</section><section><h3>Metas anuais</h3>${['in','out'].map(t=>`<div class="line"><span>${t==='in'?'Meta de receitas':'Limite de despesas'}</span><b>${money(vals.reduce((a,x)=>a+x[t==='in'?0:1],0))} / ${goal[t]?money(goal[t]):'Não definida'}</b></div>`).join('')}</section><section><h3>Despesas por categoria</h3>${db.cats.out.map(c=>[c,sum(paid.filter(r=>r.cat===c),'out')]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]).map(a=>`<div class="line">${esc(a[0])}<b>${money(a[1])}</b></div>`).join('')||'<p class="muted">Sem despesas pagas.</p>'}</section>`}else if(tab==='Lançamentos'){v=`<section><h2>Lançamentos por data de registro</h2><div class="toolbar"><input id="search" placeholder="Buscar descrição, projeto..." oninput="filterList()"><select id="kind" onchange="filterList()"><option value="">Todos os tipos</option><option value="in">Receitas</option><option value="out">Despesas</option></select><button onclick="csv()">Exportar CSV</button></div><div id="list">${listing(period)}</div></section>`}else if(tab==='Pendências'){v=`<section><h2>Contas a receber e a pagar</h2><p class="muted">Por vencimento no período selecionado.</p><div class="grid">${card('A receber',money(sum(pending.fil ="${fmt((db.goals[y]?.out||0))}"></label></div><button class="primary">Salvar configurações</button></form></section><section><h3>Plano de contas</h3><form class="toolbar" onsubmit="addCat(event)"><select name="type"><option value="in">Receita</option><option value="out">Despesa</option></select><input name="cat" required placeholder="Nova categoria"><button>Adicionar</button></form>${['in','out'].map(t=>`<h3>${t==='in'?'Receitas':'Despesas'}</h3><p>${db.cats[t].map(esc).join(' · ')}</p>`).join('')}</section>${['project','account'].map(k=>`<section><h3>${k==='project'?'Projetos / clientes cadastrados':'Contas / meios de pagamento'}</h3><form class="toolbar" onsubmit="addKnown(event,'${k}')"><input name="item" required maxlength="100" placeholder="Novo cadastro"><button>Adicionar</button></form><p>${known(k).map(esc).join(' · ')||'Nenhum cadastro'}</p></section>`).join('')}<section><h3>Segurança dos dados</h3><p>Os registros ficam neste navegador. Faça backups frequentes. Para usar outro dispositivo, restaure o backup mais recente.</p><div class="toolbar"><button onclick="backup()">Baixar backup completo</button><button onclick="$('restore').click()">Restaurar backup</button><button onclick="csv()">Exportar todos em CSV</button></div></section>`}$('view').innerHTML=v}function ring(label,p){let v=p===null?'—':p.toFixed(1).replace('.',',')+'%';return `<div><div class="ring" style="--pct:${Math.max(0,Math.min(100,p||0))}%" data-label="${v}"></div><small>${label}</small></div>`}function trend(vals){let max=Math.max(1,...vals.flat()),x=i=>24+i*30,y=v=>132-v/max*110;return `<svg class="trend" viewBox="0 0 380 158" role="img" aria-label="Tendência mensal de receitas e despesas">${[22,59,96,132].map(n=>`<line class="guide" x1="24" x2="354" y1="${n}" y2="${n}"/>`).join('')}${[0,1].map(k=>`<polyline stroke="${k?'#ffad86':'#40dfb0'}" points="${vals.map((r,i)=>x(i)+','+y(r[k])).join(' ')}"/>`).join('')}${months.map((n,i)=>`<text x="${x(i)}" y="150" text-anchor="middle">${n}</text>`).join('')}</svg>`}function analytics(paid,pending){let a=sum(paid,'in'),b=sum(paid,'out');let vals=months.map((_,i)=>{let r=db.rows.filter(x=>x.paid?.startsWith(y+'-'+String(i+1).padStart(2,'0')));return [sum(r,'in'),sum(r,'out')]});let max=Math.max(1,...vals.flat());let bars=(items,total,cls='')=>items.length?items.map(([n,v])=>`<div class="line"><span>${esc(n)}</span><b>${money(v)} · ${total?(v/total*100).toFixed(1).replace('.',','):0}%</b></div><div class="meter ${cls}"><i style="width:${Math.min(100,v/Math.max(1,total)*100)}%"></i></div>`).join(''):'<p class="muted">Sem movimentação no período.</p>';let group=(t,k)=>[...new Set(paid.filter(r=>r.type===t).map(r=>r[k]||(k==='project'?'Desvinculada de projeto':'Não informado')))].map(n=>[n,sum(paid.filter(r=>(r[k]||(k==='project'?'Desvinculada de projeto':'Não informado'))===n),t)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);let projects=[...new Set(paid.map(r=>r.project||'Desvinculada de projeto'))];let overdue=pending.filter(r=>r.due<today());let upcoming=Array.from({length:3},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);let k=d.toLocaleDateString('sv-SE').slice(0,7),r=db.rows.filter(x=>!x.paid&&x.due.startsWith(k));return [k,money(sum(r,'in')),money(sum(r,'out')),money(net(r))]});let prior=db.rows.filter(r=>r.paid&&r.paid.startsWith(String(y-1)+(m?'-'+m:'')));return `<h2>Análise gerencial</h2><p class="muted">Valores liquidados no período; previsão por vencimento. Selecione um mês no gráfico.</p><div class="grid">${card('Resultado de caixa',money(a-b))}${card('Margem de caixa',a?((a-b)/a*100).toFixed(1).replace('.',',')+'%':'—')}${card('Receitas · período anterior (ano)',money(sum(prior,'in')))}${card('Despesas · período anterior (ano)',money(sum(prior,'out')))}</div><section><h3>Receitas e despesas mensais · ${y}</h3><p class="muted">Verde: receitas · Marrom: despesas</p><div class="chart">${vals.map((r,i)=>`<button class="month ${m===String(i+1).padStart(2,'0')?'selected':''}" style="border:0;padding:0 0 25px" onclick="m='${String(i+1).padStart(2,'0')}';$('month').value=m;render()" aria-label="${months[i]}: ${money(r[0])} / ${money(r[1])}"><div class="bar" style="height:${r[0]/max*100}%"></div><div class="bar out" style="height:${r[1]/max*100}%"></div><span>${months[i]}</span></button>`).join('')}</div></section><div class="analytics"><section><h3>Onde o escritório gasta</h3>${bars(group('out','cat'),b,'out')}</section><section><h3>Origem das receitas</h3>${bars(group('in','cat'),a)}</section><section><h3>Concentração de receitas por projeto</h3>${bars(group('in','project'),a)}</section><section><h3>Despesas por projeto</h3>${bars(group('out','project'),b,'out')}</section><section><h3>Resultado de caixa por projeto</h3>${table(['Projeto','Recebido','Pago','Resultado'],projects.map(n=>{let r=paid.filter(x=>(x.project||'Desvinculada de projeto')===n);return [esc(n),money(sum(r,'in')),money(sum(r,'out')),money(net(r))]}))}</section><section><h3>Pendências vencidas no período</h3><div class="line">A receber<b>${money(sum(overdue,'in'))}</b></div><div class="line">A pagar<b>${money(sum(overdue,'out'))}</b></div></section><section><h3>Previsão de caixa · próximos 3 meses</h3><p class="muted">Mês atual e dois seguintes, independente do filtro. Inclui pendências vencidas nesses meses; não inclui saldo inicial.</p>${table(['Mês','A receber','A pagar','Diferença'],upcoming)}</section></div>`}function filterList(){let q=$('search').value.toLowerCase(),t=$('kind').value;$('list').innerHTML=listing(db.rows.filter(r=>match(r.date)&&(!t||r.type===t)&&[r.desc,r.project,r.cat,r.note].join(' ').toLowerCase().includes(q)))}const fmt=n=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n/100);const cents=s=>Number(String(s).replace(/[^0-9]/g,''))*(String(s).startsWith('-')?-1:1);document.addEventListener('input',e=>{if(e.target.matches('[data-money]')){let n=cents(e.target.value);if(Number.isSafeInteger(n))e.target.value=fmt(n)}});function suggest(input){let box=$(input.name+'Suggestions');for(let k of ['project','account'])if(k!==input.name)$(k+'Suggestions').replaceChildren();box.replaceChildren();let norm=v=>v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();for(let v of known(input.name).filter(v=>norm(v).includes(norm(input.value))).slice(0,8)){let b=document.createElement('button');b.type='button';b.textContent=v;b.onclick=()=>{input.value=v;box.replaceChildren()};box.append(b)}}document.addEventListener('focusin',e=>{if(!e.target.closest('.suggest'))for(let k of ['project','account'])$(k+'Suggestions').replaceChildren()});const f=$('entry');function categories(){f.elements.cat.innerHTML=db.cats[f.elements.type.value].map(c=>`<option>${esc(c)}</option>`).join('')}function edit(id){editing=id||null;f.reset();let r=db.rows.find(x=>x.id===id);f.elements.date.value=today();f.elements.due.value=today();f.elements.type.value=r?.type||'in';categories();if(r)for(let k of ['type','desc','cat','date','due','paid','project','account','note','value'])f.elements[k].value=k==='value'?fmt(r.value):r[k]||'';f.elements.parts.disabled=!!r;for(let k of ['project','account'])$(k+'Suggestions').replaceChildren();$('formtitle').textContent=r?'Editar lançamento':'Novo lançamento';$('dlg').showModal()}function known(k){return [...new Set([...(db.registry?.[k]||[]),...db.rows.map(r=>r[k])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}function addKnown(e,k){e.preventDefault();let v=e.target.elements.item.value.trim();if(!v)return;db.registry??={};db.registry[k]=[...new Set([...(db.registry[k]||[]),v])];save();render()}function shift(d,i){let [a,b,c]=d.split('-').map(Number),x=new Date(a,b-1+i,1,12);x.setDate(Math.min(c,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x.toLocaleDateString('sv-SE')}function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}f.onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(f)),n=editing?1:+r.parts,total=cents(r.value);delete r.parts;if(!Number.isSafeInteger(total)||!Number.isInteger(n)||n<1||n>120||total<n||n>1&&r.paid){alert('Verifique o valor das parcelas. Para parcelar, deixe a liquidação em branco.');return}let previous=db.rows.slice();if(editing){db.rows=db.rows.map(x=>x.id===editing?{...r,id:editing,value:total}:x)}else for(let i=0;i<n;i++)db.rows.push({...r,id:uid(),value:Math.floor(total/n)+(i<total%n?1:0),due:shift(r.due,i),desc:r.desc+(n>1?` (${i+1}/${n})`:'')});if(!save()){db.rows=previous;return}$('dlg').close();render()};function settle(id){let r=db.rows.find(x=>x.id===id);if(!r||r.paid)return;let old=r.paid;r.paid=today();if(!save())r.paid=old;render()}function removeRow(id){if(confirm('Excluir este lançamento?')){db.rows=db.rows.filter(x=>x.id!==id);save();render()}}function setGoals(e){e.preventDefault();let a=new FormData(e.target);db.opening=cents(a.get('opening'));db.goals[y]={in:cents(a.get('in')),out:cents(a.get('out'))};save();render()}function addCat(e){e.preventDefault();let a=new FormData(e.target),t=a.get('type'),c=a.get('cat').trim();if(c&&!db.cats[t].includes(c))db.cats[t].push(c);save();render()}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('atelie-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function csv(){let fields=['type','desc','cat','value','date','due','paid','project','account','note'];let quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('atelie-lancamentos.csv','\ufeff'+['Tipo;Descrição;Categoria;Valor;Lançamento;Vencimento;Liquidação;Projeto;Conta;Observações',...db.rows.map(r=>fields.map(k=>quote(k==='value'?(r.value/100).toFixed(2).replace('.',','):k==='type'?(r.type==='in'?'Receita':'Despesa'):r[k])).join(';'))].join('\r\n'),'text/csv;charset=utf-8')} $('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.rows)||!['in','out'].every(t=>Array.isArray(x.cats?.[t])&&x.cats[t].every(c=>typeof c==='string'))||!Number.isSafeInteger(x.opening)||!x.goals||!x.rows.every(r=>['in','out'].includes(r.type)&&Number.isSafeInteger(r.value)&&r.value>0&&/^[a-zA-Z0-9-]+$/.test(r.id)&&['date','due'].every(k=>/^\d{4}-\d{2}-\d{2}$/.test(r[k]))&&(!r.paid||/^\d{4}-\d{2}-\d{2}$/.test(r.paid))))throw Error();if(confirm('Substituir TODOS os registros locais pelo backup?')){db=x;save();render()}}catch{alert('Backup inválido ou não legível.')}e.target.value=''};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
